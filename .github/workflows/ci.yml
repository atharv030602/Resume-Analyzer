name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Lint & test (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Run tests (deterministic, no API keys)
        env:
          DB_ENABLED: "false"
          VECTOR_BACKEND: memory
        run: pytest -q

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (no AI stack, fast)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          build-args: |
            INSTALL_AI=false
            INSTALL_CHROMA=false
          tags: resumefit-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: resumefit-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
